          "font-family:Inter,sans-serif;";

        var card = document.createElement("div");
        card.style.cssText =
          "width:100%;background:#17284F;color:#fff;border-radius:20px;" +
          "padding:18px 18px 20px;box-shadow:0 14px 40px -10px rgba(23,40,79,.6);" +
          "position:relative;";

        // ícone "Compartilhar" do iOS (quadrado com seta para cima)
        var shareIcon =
          "<svg width='26' height='26' viewBox='0 0 24 24' fill='none' " +
          "stroke='#8Fc2ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' " +
          "style='vertical-align:middle;margin:0 4px'>" +
          "<path d='M12 3v13'/><path d='M8 7l4-4 4 4'/>" +
          "<path d='M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7'/></svg>";

        card.innerHTML =
          "<div style='font-size:17px;font-weight:700;margin-bottom:6px'>" +
          "Instale o app na tela do celular</div>" +
          "<div style='font-size:15px;line-height:1.5;color:#dbe3f2'>" +
          "1. Toque no botão " + shareIcon + " <b>Compartilhar</b> (abaixo)." +
          "<br>2. Escolha <b>Adicionar à Tela de Início</b>.</div>";

        var close = document.createElement("button");
        close.textContent = "✕";
        close.setAttribute("aria-label", "Fechar");
        close.style.cssText =
          "position:absolute;top:10px;right:10px;background:transparent;border:none;" +
          "color:#9fb0d0;font-size:18px;cursor:pointer;padding:6px;line-height:1;";
        close.onclick = function () { wrap.remove(); };
        card.appendChild(close);

        // seta apontando para baixo (em direção à barra do Safari)
        var arrow = document.createElement("div");
        arrow.textContent = "▼";
        arrow.style.cssText =
          "color:#17284F;font-size:22px;line-height:1;margin-top:-2px;" +
          "text-shadow:0 6px 10px rgba(23,40,79,.4);animation:navBounce 1.2s infinite;";

        var kf = document.createElement("style");
        kf.textContent =
          "@keyframes navBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}";
        document.head.appendChild(kf);

        wrap.appendChild(card);
        wrap.appendChild(arrow);
        document.body.appendChild(wrap);
      }, 1500);
    });
  }
})();
</script>
</body>
</html>
