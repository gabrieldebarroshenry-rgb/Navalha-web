      sheet.appendChild(row("ID do usu\u00E1rio (uid)", user.uid, true));
    } else if (F) {
      sheet.appendChild(el("div",
        "background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;font:500 14px Inter,sans-serif;color:#9a3412;margin-bottom:14px",
        "Voc\u00EA n\u00E3o est\u00E1 logado. Fa\u00E7a login no app para ver seu ID e editar a barbearia."));
    } else {
      sheet.appendChild(el("div",
        "background:#f4f5f7;border-radius:12px;padding:12px;font:500 14px Inter,sans-serif;color:#5b6472;margin-bottom:14px",
        "Modo local (sem nuvem). O ID do usu\u00E1rio e a edi\u00E7\u00E3o por aqui s\u00F3 funcionam com o Firebase configurado."));
    }

    sheet.appendChild(el("div", "font:700 13px Inter,sans-serif;color:#17284F;margin:12px 0 10px", "Barbearia"));
    sheet.appendChild(row("ID da barbearia", SHOP_ID, true));

    if (user) {
      sheet.appendChild(field("Nome da barbearia", "np-name", "Ex.: Barbearia do Wesley"));
      sheet.appendChild(field("WhatsApp", "np-whats", "Ex.: 11 99999-0000"));
      sheet.appendChild(field("Endere\u00E7o", "np-addr", "Ex.: Rua tal, 123 \u2014 Centro"));
      var msg = el("div", "font:500 13px Inter,sans-serif;margin:4px 0 12px;min-height:18px");
      sheet.appendChild(msg);
      var save = el("button",
        "width:100%;border:none;background:#17284F;color:#fff;border-radius:14px;padding:14px;font:700 15px Inter,sans-serif;cursor:pointer",
        "Salvar altera\u00E7\u00F5es");
      sheet.appendChild(save);

      var docRef = F.firestore().collection("barbershops").doc(SHOP_ID);
      docRef.get().then(function (snap) {
        var d = (snap && snap.exists) ? snap.data() : {};
        document.getElementById("np-name").value = d.name || "";
        document.getElementById("np-whats").value = d.whatsapp || "";
        document.getElementById("np-addr").value = d.address || "";
      }).catch(function () {});

      save.onclick = function () {
        var data = {
          name: document.getElementById("np-name").value.trim(),
          whatsapp: document.getElementById("np-whats").value.trim(),
          address: document.getElementById("np-addr").value.trim()
        };
        save.disabled = true; save.textContent = "Salvando...";
        docRef.set(data, { merge: true }).then(function () {
          msg.style.color = "#3F7A5B";
          msg.textContent = "\u2713 Salvo! As mudan\u00E7as j\u00E1 aparecem no app.";
          save.disabled = false; save.textContent = "Salvar altera\u00E7\u00F5es";
        }).catch(function (err) {
          msg.style.color = "#E01E37";
          msg.textContent = "N\u00E3o foi poss\u00EDvel salvar. " +
            (err && err.code === "permission-denied" ? "Verifique as regras do Firestore." : "Verifique a conex\u00E3o e tente de novo.");
          save.disabled = false; save.textContent = "Salvar altera\u00E7\u00F5es";
        });
      };
    }
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
  }
  function buildGear() {
    if (built) return; built = true;
    // Sem botão visível: mantenha o dedo pressionado ~1s no canto
    // inferior direito da tela para abrir as Configurações.
    var HOLD_MS = 900, SIZE = 70;
    var timer = null;
    function inCorner(x, y) {
      var w = window.innerWidth, h = window.innerHeight;
      return x >= w - SIZE && y >= h - SIZE;
    }
    function start(x, y) {
      if (!inCorner(x, y)) return;
      timer = setTimeout(function () { openPanel(); timer = null; }, HOLD_MS);
    }
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    document.addEventListener("touchstart", function (e) {
      var t = e.touches && e.touches[0];
      if (t) start(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener("touchmove", cancel, { passive: true });
    document.addEventListener("touchend", cancel, { passive: true });
    document.addEventListener("mousedown", function (e) { start(e.clientX, e.clientY); });
    document.addEventListener("mouseup", cancel);
    document.addEventListener("mousemove", function (e) {
      if (timer && !inCorner(e.clientX, e.clientY)) cancel();
    });
  }
  window.addEventListener("load", function () {
    var tries = 0;
    var iv = setInterval(function () {
      tries++;
      var F = fb();
      if (F) { F.auth().onAuthStateChanged(function (u) { if (u) buildGear(); }); clearInterval(iv); }
      else if (tries > 12) { buildGear(); clearInterval(iv); }
    }, 500);
  });
})();
